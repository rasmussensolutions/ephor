services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ephor
      POSTGRES_DB: ephor
      POSTGRES_PASSWORD: ${EPHOR_DB_PASSWORD:?Set EPHOR_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  panel:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://ephor:${EPHOR_DB_PASSWORD}@database:5432/ephor
      EPHOR_ORIGIN: ${EPHOR_ORIGIN:?Set the public HTTPS origin}
      EPHOR_RELEASE_URL: ${EPHOR_RELEASE_URL:-}
      EPHOR_RELEASE_PUBLIC_KEY: ${EPHOR_RELEASE_PUBLIC_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate a 64-character secret}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  database:
