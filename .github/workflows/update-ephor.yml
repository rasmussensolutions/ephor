name: Update Ephor
# ephor-panel-protocol: 1
run-name: ${{ inputs.panel_request && format('Ephor panel {0}', inputs.panel_request) || 'Update Ephor' }}

on:
  workflow_dispatch:
    inputs:
      panel_request:
        description: Panel request ID (leave empty for the GitHub flow)
        type: string
        default: ""
      target:
        description: Exact tested official commit (optional)
        type: string
        default: ""
      base:
        description: Expected deployment branch commit (optional)
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: update-ephor
  cancel-in-progress: false

jobs:
  update:
    if: github.repository != 'rasmussensolutions/ephor' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the latest tested official version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TARGET: ${{ inputs.target }}
          EXPECTED_BASE: ${{ inputs.base }}
          PANEL_REQUEST: ${{ inputs.panel_request }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PANEL_REQUEST" ]]; then
            [[ "$PANEL_REQUEST" =~ ^[a-f0-9-]{36}$ && "$EXPECTED_BASE" =~ ^[a-f0-9]{40}$ && "$REQUESTED_TARGET" =~ ^[a-f0-9]{40}$ ]]
          fi
          if [[ -n "$EXPECTED_BASE" ]]; then
            [[ "$EXPECTED_BASE" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$EXPECTED_BASE" ]] || { echo 'Production branch changed. Prepare a new update.'; exit 1; }
          fi
          target=$(gh api 'repos/rasmussensolutions/ephor/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1' --jq '.workflow_runs[0].head_sha // empty')
          [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo 'No successfully tested official version is available.'; exit 1; }
          if [[ -n "$REQUESTED_TARGET" ]]; then
            [[ "$REQUESTED_TARGET" =~ ^[a-f0-9]{40}$ ]]
            tested=$(gh api "repos/rasmussensolutions/ephor/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$REQUESTED_TARGET&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
            [[ "$tested" == "$REQUESTED_TARGET" ]] || { echo 'Requested version has not passed official CI.'; exit 1; }
            target="$REQUESTED_TARGET"
          fi
          git fetch --no-tags https://github.com/rasmussensolutions/ephor.git main
          git merge-base --is-ancestor "$target" FETCH_HEAD
          echo "commit=$target" >> "$GITHUB_OUTPUT"
      - name: Prepare update while preserving installation settings
        id: prepare
        env:
          TARGET: ${{ steps.version.outputs.commit }}
        run: python3 scripts/update-ephor.py "$TARGET"
      - name: Report current version
        if: steps.prepare.outputs.changed == 'false'
        run: echo 'Already at the latest successfully tested official version.' >> "$GITHUB_STEP_SUMMARY"
      - name: Open update pull request
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.version.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          PANEL_REQUEST: ${{ inputs.panel_request }}
        shell: bash
        run: |
          set -euo pipefail
          branch="ephor-update/$TARGET"
          existing=$(gh pr list --repo "$REPOSITORY" --head "$branch" --base "$BASE" --state open --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "An update is already open: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "An update branch already exists. Review it and open/reopen its pull request in GitHub: https://github.com/$REPOSITORY/compare/$BASE...$branch" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Ephor to $TARGET"
          # No persistent credentials or access to Cloudflare secrets is needed.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          if [[ -n "$PANEL_REQUEST" ]]; then
            echo 'Prepared. Return to Ephor to review and install this update.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body="$RUNNER_TEMP/ephor-update-pr.md"
          cat > "$body" <<BODY
          Updates Ephor to https://github.com/rasmussensolutions/ephor/commit/$TARGET, which passed official CI.

          Installation configuration is preserved. Existing migrations are unchanged; review any new migrations before merging. The updater has no Cloudflare credentials and has not touched your database.

          Workflow files and the updater itself are preserved; review upstream automation changes separately using the panel update guide.

          Before merging:
          - Review the changes and release notes, including new migrations and any local customizations.
          - Confirm your D1 recovery point or export is available. A code rollback does not undo database migrations.
          - Keep Cloudflare preview builds disabled for this repository.
          - Approve GitHub check runs if prompted and wait for them to pass.

          Merge in GitHub to let Cloudflare deploy your production branch. Keep the existing database, origin and authentication secret. Owner setup is not repeated.
          BODY
          if url=$(gh pr create --repo "$REPOSITORY" --base "$BASE" --head "$branch" --title "Update Ephor to ${TARGET:0:12}" --body-file "$body"); then
            echo "Review and merge: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Branch prepared. Enable 'Allow GitHub Actions to create and approve pull requests' under Settings → Actions → General, or open a pull request from $branch in GitHub." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
