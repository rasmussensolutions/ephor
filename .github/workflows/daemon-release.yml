name: Release daemon
on:
  push:
    tags: ["daemon-v*"]
permissions:
  contents: read
concurrency:
  group: daemon-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: aarch64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Free disk for Docker integration tests
        if: matrix.arch == 'x86_64'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2
        with:
          cache-key: ephord-linux-${{ matrix.arch }}
      - run: bun install --frozen-lockfile
      - run: bun run lint && bun run test
      - run: cargo test --workspace --locked
      - run: bun run bundle:daemon "$ARCH"
      - run: ./apps/dashboard/public/daemon/ephord-linux-"$ARCH" sample
      - name: Test Linux update and rollback
        if: matrix.arch == 'x86_64'
        run: |
          docker buildx build --load --platform linux/amd64 -t ephor-updater-test -f deploy/daemon/test.Dockerfile .
          EPHOR_TEST_LINUX_UPDATER=1 bun test packages/api/test/updater-linux.test.ts
      - name: Test service deployments and recovery
        if: matrix.arch == 'x86_64'
        run: bun run test:services:linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon-${{ matrix.arch }}
          path: apps/dashboard/public/daemon/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only the reviewed publish job can access the signing key.
    environment: daemon-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: daemon-*
          path: target/release-inputs/
      - name: Verify and combine architecture builds
        run: bun scripts/merge-daemon-artifacts.ts target/release-inputs apps/dashboard/public/daemon
      - name: Sign release metadata
        env:
          EPHOR_RELEASE_SIGNING_KEY: ${{ secrets.EPHOR_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: bun scripts/release-daemon.ts sign apps/dashboard/public/daemon "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/" apps/dashboard/public/daemon/release.json
      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Signed Ephor daemon release. See docs/updates.md for verification and setup." apps/dashboard/public/daemon/ephord-linux-* apps/dashboard/public/daemon/manifest.json apps/dashboard/public/daemon/release.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
