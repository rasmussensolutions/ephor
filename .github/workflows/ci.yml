name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ephor_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ephor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ephor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run test
        env:
          TEST_DATABASE_URL: postgres://ephor_test:test_password@localhost:5432/ephor_test
      - run: bun run build
      - run: bun run typecheck
      - name: Check generated routes are committed
        run: git diff --exit-code -- apps/dashboard/src/routeTree.gen.ts apps/website/src/routeTree.gen.ts

  rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for Docker integration tests
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2
        with:
          cache-key: ephord-linux-x86_64
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Real daemon enrollment and telemetry
        run: EPHOR_DAEMON_TEST_BINARY="$PWD/target/debug/ephord" bun test packages/api/test/machines.test.ts
      - name: Build Linux updater integration fixture
        run: |
          bun run bundle:daemon x86_64
          docker buildx build --load --platform linux/amd64 -t ephor-updater-test -f deploy/daemon/test.Dockerfile .
      - name: Linux signed update and rollback integration
        run: EPHOR_TEST_LINUX_UPDATER=1 bun test packages/api/test/updater-linux.test.ts
      - name: Service deployment and HTTPS routing integration
        run: bun run test:services:linux
